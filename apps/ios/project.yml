name: Stargaze
options:
  bundleIdPrefix: com.stargaze
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: Stargaze/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.stargaze.app
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Stargaze:
    type: application
    platform: iOS
    sources:
      - path: Stargaze
    settings:
      base:
        PRODUCT_NAME: Stargaze
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Stargaze/Info.plist
      properties:
        CFBundleDisplayName: Stargaze
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Stargaze needs the camera for sky pass-through AR.
        NSLocationWhenInUseUsageDescription: Stargaze uses your location to align stars with the sky.
        NSMotionUsageDescription: Stargaze uses motion sensors to track where you point the phone.
