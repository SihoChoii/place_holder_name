name: Stargaze
options:
  bundleIdPrefix: com.stargaze
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.stargaze.app
    CODE_SIGN_STYLE: Automatic

targets:
  Stargaze:
    type: application
    platform: iOS
    sources:
      - path: Stargaze
    settings:
      base:
        PRODUCT_NAME: Stargaze
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.0.0
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Stargaze uses the camera to overlay star positions on your live sky view"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Stargaze uses your location to accurately display stars visible from your position"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
