services:
  postgres:
    image: postgres:16-alpine
    container_name: stargaze-postgres
    restart: unless-stopped
    ports:
      # 5433 avoids clashing with a local Postgres on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: stargaze
      POSTGRES_PASSWORD: stargaze
      POSTGRES_DB: stargaze
    volumes:
      - stargaze_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stargaze -d stargaze"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stargaze_pgdata:
